# screenshot-map.yml
#
# What each image in static/img/ shows, so a repeat triage run does not have to
# re-classify everything. Read by the screenshot-triage skill.
#
# Format, one entry per image path:
#   shows      short description of the image content
#   area       UI area it maps to, one of:
#              workflow-canvas, step-editor, runs-history, credentials,
#              triggers, project-settings, lightning-other,
#              external (another product's UI), diagram, non-ui-photo
#   confidence high | medium | low  - how sure the classification is
#   status     active | legacy (only used in versioned_docs) | unused
#
# Dates are NOT stored here; they are recomputed on every run.
# Humans may edit any entry - corrections are kept and not overwritten.

