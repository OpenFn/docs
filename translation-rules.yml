# translation-rules.yml
#
# Purpose
# -------
# Locale-specific phrasing rules learned from human edits to machine
# translations. The translate skill (.agents/skills/translate/SKILL.md) loads this
# file after glossary.yml and applies every rule whose `locale` matches the
# target locale.
#
# Glossary terms (never translate) belong in glossary.yml, not here. This file
# is for how to translate, not what to leave alone.
#
# Humans maintain this file. Add a rule when you correct a translation in a
# way that should apply to other pages too.
#
# Schema
# ------
# rules:
#   - locale: string        # "es" or "fr" (or "*" for every locale)
#     kind: string          # one of:
#                           #   term        - a fixed rendering for a phrase
#                           #   register    - tone/voice guidance (formal vs informal "you")
#                           #   punctuation - spacing, quotation marks, list punctuation
#                           #   structure   - how to handle headings, admonition titles, UI labels
#                           #   avoid       - a rendering the reviewer rejected
#     source: string        # English phrase or pattern the rule applies to (for
#                           # kind: term and avoid). Omit for global rules.
#     target: string        # required rendering (kind: term) or rejected rendering
#                           # (kind: avoid)
#     instruction: string   # plain-language rule the translator must follow
#     example_source: string   # optional English example
#     example_target: string   # optional translated example
#     reason: string        # why, in one sentence
#     added_by: string      # GitHub handle
#     added_on: string      # ISO date (YYYY-MM-DD)
#     source_pr: string     # PR URL or number where the edit happened
#
# Example
# -------
# rules:
#   - locale: es
#     kind: register
#     instruction: Address the reader as "tú", not "usted".
#     reason: Matches the informal tone of the English docs.
#     added_by: someone
#     added_on: 2026-01-01
#     source_pr: https://github.com/OpenFn/docs/pull/000
#   - locale: fr
#     kind: punctuation
#     instruction: Put a non-breaking space before ":", ";", "?" and "!".
#     example_source: "Next step: add a credential."
#     example_target: "Étape suivante : ajoutez un identifiant."
#     reason: Standard French typography.
#     added_by: someone
#     added_on: 2026-01-01
#     source_pr: https://github.com/OpenFn/docs/pull/000

rules:
  - locale: es
    kind: register
    instruction: >-
      Write neutral Latin American Spanish (es-419). Address the reader as
      "tú", never "vosotros" or "vos". Prefer words used across the region:
      computadora, capacitación (training), lista de verificación (checklist),
      contactar a, recolección de datos, la CLI. Avoid Spain-only forms such as
      ordenador, formación for training, lista de comprobación, contactar con,
      and plantearse, and avoid slang from any one country.
    reason: >-
      The Spanish docs are for readers across Latin America, and one neutral
      variety reads naturally to all of them.
    added_by: lmac-1
    added_on: 2026-10-01
  - locale: es
    kind: structure
    instruction: >-
      English terms kept from glossary.yml take a fixed gender and an English
      plural with "-s". Feminine: la work order, la CLI, la API. Masculine:
      el workflow, el step, el job, el run, el trigger, el adaptor, el
      webhook, el dataclip, el sandbox, el Canvas, el Inspector, el cron.
      Any English term not listed here is masculine.
    example_source: The work order creates two runs.
    example_target: La work order crea dos runs.
    reason: >-
      Kept English terms have no gender of their own, so without a rule each
      page could pick a different one.
    added_by: lmac-1
    added_on: 2026-10-01
