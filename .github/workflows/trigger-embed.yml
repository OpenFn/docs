name: Trigger Embed Service

on:
  push:
    branches:
      - main

jobs:
  trigger-embed:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Embed Service
        env:
          APOLLO_STAGING_API_KEY: ${{ secrets.APOLLO_STAGING_API_KEY }}
        run: |
          curl -f -X POST https://apollo.staging.openfn.org/services/embed_docsite \
            -H "Content-Type: application/json" \
            -d "{\"api_key\": \"$APOLLO_STAGING_API_KEY\"}"
